<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="service-doc" href="/api/docs" type="text/html">
    <link rel="service-desc" href="/openapi.json" type="application/json">
    <link rel="describedby" href="/llms.txt" type="text/markdown">
    <title>ntfuzz · Continuous Go Fuzzing Dashboard</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            background: #10151d;
            color: #e4edf7;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            overflow: hidden;
            background: #10151d;
        }
        body {
            position: fixed;
            inset-inline: 0;
            top: var(--terminal-viewport-top, 0px);
            height: var(--terminal-viewport-height, 100dvh);
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            display: flex;
            flex-direction: column;
        }
        .topbar {
            --ntfuzz-accent: #38bdf8;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 6px 14px;
            background: #161f2c;
            border-bottom: 1px solid #2d3f56;
            font-size: 13px;
            min-width: 0;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            flex: 1 1 auto;
            overflow: hidden;
            font-weight: 600;
            color: var(--ntfuzz-accent, #38bdf8);
        }
        .brand-wordmark {
            color: var(--ntfuzz-accent, #38bdf8);
            text-decoration: none;
            font-weight: 700;
            letter-spacing: 0.03em;
            flex-shrink: 0;
            border-radius: 3px;
        }
        .brand-wordmark:hover {
            text-decoration: underline;
            text-underline-offset: 3px;
        }
        .brand-wordmark:focus-visible,
        .brand-operator:focus-visible {
            outline: 2px solid var(--ntfuzz-accent, #38bdf8);
            outline-offset: 2px;
        }
        .brand-version {
            color: #64748b;
            font-weight: 400;
            font-family: ui-monospace, monospace;
            font-size: 11px;
            flex-shrink: 0;
        }
        .brand-sep {
            color: #64748b;
            font-weight: 400;
            flex-shrink: 0;
            user-select: none;
        }
        .brand-operator {
            color: #e4edf7;
            font-weight: 600;
            text-decoration: none;
            min-width: 0;
            max-width: 32ch;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            border-radius: 3px;
        }
        a.brand-operator {
            text-decoration: underline;
            text-decoration-color: var(--ntfuzz-accent, #38bdf8);
            text-underline-offset: 3px;
        }
        a.brand-operator:hover {
            color: var(--ntfuzz-accent, #38bdf8);
        }
        .brand-sub {
            color: #94a3b8;
            font-weight: 400;
            font-family: ui-monospace, monospace;
            font-size: 12px;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
            white-space: nowrap;
            font-family: ui-monospace, monospace;
            font-size: 12px;
            color: #94a3b8;
        }
        @media (max-width: 640px) {
            .brand-sub {
                display: none;
            }
            .brand-operator {
                max-width: 42vw;
            }
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #64748b;
            transition: background-color 0.25s;
        }
        .status-dot.connected { background: #22c55e; }
        .status-dot.disconnected { background: #ef4444; }
        .status-dot.connecting, .status-dot.reconnecting { background: #eab308; }
        #terminal-container {
            flex: 1;
            min-height: 0;
            padding: 6px;
            background: var(--booba-background, #10151d);
            overflow: hidden;
        }
        #action-controls {
            background: #161f2c;
            border-top: 1px solid #2d3f56;
            padding: 6px 12px;
        }
        .api-links {
            flex-shrink: 0;
            padding: 6px 12px;
            background: #161f2c;
            font-size: 12px;
            line-height: 1.5;
        }
        .api-links a { color: #7dd3fc; }
        .booba-action {
            min-height: 44px;
            min-width: 44px;
            padding: 6px 10px;
            border: 1px solid #334155;
            border-radius: 6px;
            background: #1e293b;
            color: #e2e8f0;
        }
        .booba-action--keyboard {
            margin-inline-start: auto;
        }
        .booba-action:disabled { opacity: .45; }
        .booba-action:focus-visible { outline: 2px solid #38bdf8; outline-offset: -2px; }
        .api-links summary { cursor: pointer; min-height: 32px; display: flex; align-items: center; }
        .api-links nav { padding-bottom: 6px; }
        .topbar, #action-controls, .api-links { flex-shrink: 0; }
        @media (max-width: 700px), (max-height: 500px) {
            .topbar { padding: 5px 10px; min-height: 36px; }
            .brand-sub, #status-text { display: none; }
            #terminal-container { padding: 3px; }
            #action-controls { padding: 5px 6px; }
            /* One scrollable row, not several rows taken away from the terminal. */
            #action-controls .booba-action-bar { flex-wrap: nowrap; overflow-x: auto; gap: 6px; scrollbar-width: thin; }
            #action-controls .booba-action-group { display: contents; }
            #action-controls .booba-action { flex: 0 0 auto; white-space: nowrap; }
            #action-controls .booba-action--keyboard { margin-inline-start: 0; }
            .api-links { padding: 0 10px; max-height: 30dvh; overflow-y: auto; }
            .api-links summary { min-height: 44px; }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <a class="brand-wordmark" href="https://github.com/NimbleTerminal/ntfuzz" target="_blank" rel="noopener noreferrer">NTFUZZ</a>
            <span class="brand-version">dev</span>
            <span class="brand-sub" id="program-summary">Ghostty / Booba Live TUI</span>
        </div>
        <div class="status">
            <span class="status-dot connecting" id="status-dot"></span>
            <span id="status-text">Connecting...</span>
        </div>
    </header>
    <div id="terminal-container" aria-label="ntfuzz live terminal"></div>
    <div id="action-controls"></div>
    <details class="api-links">
        <summary>Data &amp; API</summary>
        <nav aria-label="Dashboard data">
        <a href="/api/crashes?open=true">Open crashes</a> ·
        <a href="/api/projects">Projects</a> ·
        <a href="/api/status">Status</a> ·
        <a href="/api/docs">API documentation</a> ·
        <a href="/llms.txt">Agent guide</a>
        </nav>
    </details>

    <script type="module">
        import { BoobaTerminal, installActionBar, resolveBoobaURLs } from './static/booba/booba.js';
        import { installTerminalViewport } from './viewport.js';
        import { installTerminalKeyboard } from './touch-keyboard.js';

        const dot = document.getElementById('status-dot');
        const text = document.getElementById('status-text');
        const summaryEl = document.getElementById('program-summary');

        async function main() {
            const booba = new BoobaTerminal('terminal-container', {
                fontSize: 14,
                allowOSC7501Actions: true,
                renderer: 'auto',
                theme: {
                    background: '#10151d',
                    foreground: '#e2e8f0',
                },
            });

            booba.onStatusChange = (state, message) => {
                dot.className = `status-dot ${state}`;
                text.textContent = message || state;
            };

            booba.onTitleChange = (title) => {
                document.title = title || 'ntfuzz';
            };

            booba.onProgramStatus = (report) => {
                if (report && report.message) {
                    summaryEl.textContent = report.message;
                }
            };

            await booba.init();

            booba.setActionKeyEncoder({
                canEncode: gesture => booba.encodeKey(gesture) !== null,
                encode: gesture => booba.encodeKey(gesture),
            });

            const viewport = installTerminalViewport({ root: document.body, fit: () => booba.fitAddon?.fit() });
            const keyboard = installTerminalKeyboard({ root: document.getElementById('terminal-container'), focus: () => booba.focus() });
            const disposeActions = installActionBar(booba.actions, {
                parent: document.getElementById('action-controls'),
                openKeyboard: keyboard.openKeyboard,
                onLayout: viewport.fit,
            });

            const urls = resolveBoobaURLs(document.baseURI);
            booba.connectWebSocket(urls.wsUrl);
            if (matchMedia("(pointer: fine)").matches) booba.focus();

            const dataLinks = document.querySelector('.api-links');
            dataLinks.addEventListener('toggle', viewport.fit);
            window.addEventListener('pagehide', (event) => {
                if (event.persisted) return;
                dataLinks.removeEventListener('toggle', viewport.fit);
                disposeActions(); keyboard.dispose(); viewport.dispose(); booba.dispose();
            });
        }

        main().catch(err => {
            dot.className = 'status-dot disconnected';
            text.textContent = String(err);
            console.error(err);
        });
    </script>
</body>
</html>
